aid: urbanic
name: Urbanic
description: >-
  Urbanic is an online fast-fashion retailer selling women's apparel and accessories
  through app-first, localized storefronts, including in.urbanic.com for India and
  mx.urbanic.com for Mexico, with local payment methods such as Paytm, BHIM, RuPay,
  OXXO, SPEI, Pix, and Boleto. A portfolio company of D1 Capital, Urbanic is a
  consumer ecommerce business: its storefront runs on a first-party consumer API
  (api-shop-in.urbanic.com), but it publishes no public developer API, developer
  portal, or API documentation.
